<script type="text/javascript">//<![CDATA[
	XHR.poll(-1, '<%=url('admin/hlk/mobile_conf/module_status')%>', null,
		function(x, module_info)
		{
			var tb1 = document.getElementById('module_status_table');
			var tb2 = document.getElementById('connect_status_table');
			var rows1 = [];
			var rows2 = [];
			/*
			var output = '';
			for (var entry in module_info) {
			  output += 'key: ' + entry + ' | value: ' + module_info[entry] + '\n';
			}
			alert(output);
			*/
			/* clear all rows */
			while( tb1.rows.length > 1 )
				tb1.deleteRow(1);
			while( tb2.rows.length > 1 )
				tb2.deleteRow(1);

			var tr1 = tb1.insertRow(-1);
			tr1.className = 'cbi-section-table-row cbi-rowstyle-' + 2;

			tr1.insertCell(-1).innerHTML = module_info.modulename;
			tr1.insertCell(-1).innerHTML = module_info.imei;

			var tr2 = tb2.insertRow(-1);
			tr2.className = 'cbi-section-table-row cbi-rowstyle-' + 4;

			tr2.insertCell(-1).innerHTML = module_info.simstatus;
			tr2.insertCell(-1).innerHTML = module_info.operator;
			tr2.insertCell(-1).innerHTML = module_info.rssi;
			tr2.insertCell(-1).innerHTML = module_info.nettype;

		},
	);
//]]></script>

<fieldset class="cbi-section">
	<legend><%:Mobile Module Status%></legend>
	<table class="cbi-section-table" id="module_status_table">
		<tr class="cbi-section-table-titles">
			<th class="cbi-section-table-cell"><%:MobileModule.%></th>
			<th class="cbi-section-table-cell"><%:IMEI%></th>
		</tr>
		<tr class="cbi-section-table-row">
			<td colspan="5"><em><br /><%:Collecting data...%></em></td>
		</tr>
	</table>
</fieldset>
<fieldset class="cbi-section">
	<legend><%:Connect Status%></legend>
	<table class="cbi-section-table" id="connect_status_table">
		<tr class="cbi-section-table-titles">
			<th class="cbi-section-table-cell"><%:SimStatus.%></th>
			<th class="cbi-section-table-cell"><%:Operator%></th>
			<th class="cbi-section-table-cell"><%:Rssi%></th>
			<th class="cbi-section-table-cell"><%:NetType%></th>
		</tr>
		<tr class="cbi-section-table-row">
			<td colspan="5"><em><br /><%:Collecting data...%></em></td>
		</tr>
	</table>
</fieldset>
